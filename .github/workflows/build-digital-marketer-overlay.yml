name: Build Digital Marketer Timed Share APK
on:
  push:
    branches: [digital-marketer-overlay-v11]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || test ${PIPESTATUS[1]} -eq 0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Unpack app
        run: mkdir -p mobile && unzip -q source/DigitalMarketer_TimedShare_Overlay_Source.zip -d mobile
      - name: Build APK
        working-directory: mobile
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Digital-Marketer-Timed-Share-APK
          path: mobile/app/build/outputs/apk/debug/*.apk
