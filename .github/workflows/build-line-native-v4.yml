name: Build LINE Native Scheduler APK
on:
  push:
    branches: [line-native-scheduler-v4-build]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || test ${PIPESTATUS[1]} -eq 0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Unpack project
        run: mkdir -p build-source && unzip -q native/LINE_Safe_Scheduler_v4_Native_Source.zip -d build-source
      - name: Build APK
        working-directory: build-source
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LINE-Native-v4-debug-apk
          path: build-source/app/build/outputs/apk/debug/*.apk

      - name: Export APK signing tools
        run: |
          mkdir -p signing-tools
          cp "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/lib/apksigner.jar" signing-tools/
          cp "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner" signing-tools/
          cp "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/zipalign" signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: signing-tools/
