name: Build LINE Timed Share APK
on:
  push:
    branches: [line-timed-share-standalone]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || test ${PIPESTATUS[1]} -eq 0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Unpack project
        run: mkdir -p new-app && unzip -q source/LINE_Timed_Share_Native_Source.zip -d new-app
      - name: Build APK
        working-directory: new-app
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LINE-Timed-Share-APK
          path: new-app/app/build/outputs/apk/debug/app-debug.apk
